<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>举牌模板</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 24px; background: #f6f7fb; color: #20232a; }
    main { max-width: 1100px; margin: auto; }
    .panel { background: #fff; border: 1px solid #e3e6ee; border-radius: 14px; padding: 20px; margin-bottom: 18px; box-shadow: 0 4px 18px #20232a0a; }
    h1 { margin: 0 0 8px; } h2 { margin-top: 0; font-size: 18px; }
    .hint { color: #687083; font-size: 13px; }
    label { display: block; margin: 12px 0 6px; font-weight: 600; }
    input, textarea, button { font: inherit; }
    input, textarea { width: 100%; box-sizing: border-box; border: 1px solid #ccd2df; border-radius: 8px; padding: 9px; }
    textarea { min-height: 70px; resize: vertical; }
    button { border: 0; border-radius: 8px; background: #315efb; color: white; padding: 9px 14px; cursor: pointer; }
    button.secondary { background: #edf1fb; color: #3152ba; } button.danger { background: #c83d4d; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .grid { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(280px, 1fr); gap: 18px; }
    #canvas { max-width: 100%; border: 1px dashed #8390a8; background: #fafbff; cursor: crosshair; touch-action: none; }
    .points { font-family: ui-monospace, monospace; color: #47546c; font-size: 12px; white-space: pre-wrap; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    #toast-stack { position: fixed; top: 16px; right: 16px; z-index: 100; display: flex; flex-direction: column; gap: 8px; max-width: min(380px, calc(100vw - 32px)); }
    .toast { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid; box-shadow: 0 8px 24px #20232a1f; font-size: 14px; animation: toast-in .18s ease-out; word-break: break-word; }
    .toast-success { background: #e7f6ee; border-color: #9fd8ba; color: #14603c; }
    .toast-error { background: #fdecee; border-color: #f0b6bd; color: #92293a; }
    .toast-info { background: #edf2fd; border-color: #b9c8f2; color: #274ea8; }
    .toast-close { background: transparent; color: inherit; padding: 0 4px; font-size: 16px; line-height: 1.2; opacity: .6; }
    .toast-close:hover { opacity: 1; }
    @keyframes toast-in { from { transform: translateX(12px); opacity: 0; } to { transform: none; opacity: 1; } }
    .template { display: grid; grid-template-columns: 100px 1fr auto; gap: 14px; align-items: center; border-top: 1px solid #edf0f5; padding: 14px 0; }
    .template img { width: 100px; height: 80px; object-fit: contain; background: #f4f5f8; border-radius: 8px; }
    .template h3 { margin: 0 0 5px; font-size: 16px; } .template p { margin: 3px 0; color: #687083; font-size: 13px; }
    .active { color: #18804b !important; font-weight: 700; }
    @media (max-width: 720px) { body { padding: 12px; } .grid { grid-template-columns: 1fr; } .template { grid-template-columns: 72px 1fr; } .template img { width: 72px; height: 64px; } .template .actions { grid-column: 1 / -1; } }
  </style>
</head>
<body>
<main>
  <section class="panel">
    <h1>举牌模板</h1>
    <div class="hint">上传图片后默认生成居中的长方形牌面，可直接调节牌面位置、宽度和高度。</div>
    <div id="mode-bar" style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <strong>运行模式：</strong><span id="mode-current" style="color:#2f7d5c;">读取中…</span>
      <button id="mode-switch" class="secondary" type="button" title="在独立模式与对接检索模式之间切换">切换模式</button>
      <button id="mode-reconcile" class="secondary" type="button" title="按当前配置重新对齐语义池（进池/出池），不改变配置">同步语义池</button>
      <span class="hint" id="mode-desc"></span>
    </div>
  </section>
  <section class="panel grid">
    <div>
      <h2>创建模板</h2>
      <label for="name">模板名称</label><input id="name" maxlength="80" placeholder="例如：汉娜举牌" />
      <label for="description">管理备注</label><textarea id="description" maxlength="500" placeholder="模板管理备注"></textarea>
      <label for="caption">图片含义（caption）</label><textarea id="caption" maxlength="1000" placeholder="描述这个模板适合表达的情绪、语气、动作或聊天场景"></textarea>
      <label for="tags">图片标签（多个标签用逗号分隔）</label><input id="tags" maxlength="1000" placeholder="例如：开心，鼓励，调皮，吐槽" />
      <label for="file">模板图片</label><input id="file" type="file" accept="image/png,image/jpeg,image/webp" />
      <div class="toolbar"><button id="reset" class="secondary" type="button">重置标记</button><button id="save" type="button">保存模板</button></div>
    </div>
    <div>
      <h2>牌面矩形</h2>
      <canvas id="canvas" width="640" height="480"></canvas>
      <div class="points">
        <div>拖动矩形内部可移动牌面，拖动四个角点可调整宽度和高度。</div>
        <div id="rect-summary">尚未选择图片</div>
        <input id="rect-x" type="hidden" />
        <input id="rect-y" type="hidden" />
        <input id="rect-width" type="hidden" />
        <input id="rect-height" type="hidden" />
      </div>
    </div>
  </section>
  <section class="panel">
    <h2>已创建模板</h2>
    <div id="list" class="hint">正在读取…</div>
  </section>
</main>
<div id="toast-stack" aria-live="polite"></div>
<script src="/api/plugin/page/bridge-sdk.js"></script>
<script>
(() => {
  const bridge = window.AstrBotPluginPage;
  const toastStack = document.querySelector('#toast-stack');
  function toast(message, type = 'info', options = {}) {
    /* 页内统一通知: success=绿 error=红 info=蓝; sticky=true 不自动消失 */
    const item = document.createElement('div');
    item.className = `toast toast-${type}`;
    item.setAttribute('role', type === 'error' ? 'alert' : 'status');
    const text = document.createElement('span');
    text.textContent = String(message);
    const close = document.createElement('button');
    close.type = 'button';
    close.className = 'toast-close';
    close.textContent = '×';
    close.setAttribute('aria-label', '关闭提示');
    item.append(text, close);
    toastStack.append(item);
    const dismiss = () => item.remove();
    close.onclick = dismiss;
    if (!options.sticky) setTimeout(dismiss, options.duration || (type === 'error' ? 7000 : 3500));
    return dismiss;
  }
  if (!bridge) {
    toast('页面通信组件未加载；请重新打开此页面后再试。', 'error', { sticky: true });
    console.error('[sign_meme] plugin_page_bridge_unavailable');
    return;
  }
  const api = async (path, options = {}) => { await bridge.ready(); const endpoint=path.replace(/^\//,''); const method=(options.method||'GET').toUpperCase(); if(method==='GET') return bridge.apiGet(endpoint, options.params||{}); if(method==='DELETE') return bridge.apiPost(endpoint.replace(/\/?$/,'')+'/delete', options.body||{}); return bridge.apiPost(endpoint, options.body||{}); };
  async function uploadFile(file) {
    await bridge.ready();
    const raw = await bridge.upload('upload', file);
    return raw?.data || raw?.result || raw;
  }
  const fileInput = document.querySelector('#file'), canvas = document.querySelector('#canvas'), ctx = canvas.getContext('2d');
  const pointsEl = document.querySelector('#rect-summary');
  let image = null, points = [];
  let templatesCache = [];
  function status(text, error = false) { toast(text, error ? 'error' : 'info'); }
  function getRect(){ return {x:Number(document.querySelector('#rect-x').value||0),y:Number(document.querySelector('#rect-y').value||0),width:Number(document.querySelector('#rect-width').value||0),height:Number(document.querySelector('#rect-height').value||0)}; }
  function setRect(rect){ ['x','y','width','height'].forEach(k=>document.querySelector(`#rect-${k}`).value=Math.round(rect[k]||0)); }
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (image) { const scale = Math.min(canvas.width / image.width, canvas.height / image.height); const w = image.width * scale, h = image.height * scale; ctx.drawImage(image, (canvas.width-w)/2, (canvas.height-h)/2, w, h); canvas.dataset.scale = scale; canvas.dataset.offsetX = (canvas.width-w)/2; canvas.dataset.offsetY = (canvas.height-h)/2; }
    if(image){ const rect=getRect(), scale=Number(canvas.dataset.scale||1), ox=Number(canvas.dataset.offsetX||0), oy=Number(canvas.dataset.offsetY||0); const left=ox+rect.x*scale, top=oy+rect.y*scale, right=left+rect.width*scale, bottom=top+rect.height*scale; ctx.strokeStyle='#e43d5b';ctx.lineWidth=3;ctx.strokeRect(left,top,right-left,bottom-top); ctx.fillStyle='#e43d5b'; [[left,top],[right,top],[left,bottom],[right,bottom]].forEach(([x,y])=>ctx.fillRect(x-6,y-6,12,12)); }
    pointsEl.textContent = image ? `矩形：x=${getRect().x}, y=${getRect().y}, ${getRect().width}×${getRect().height}` : '尚未选择图片';
  }
  fileInput.addEventListener('change', () => { const f = fileInput.files[0]; if (!f) return; const url = URL.createObjectURL(f); image = new Image(); image.onload = () => { setRect({x:image.width*.2,y:image.height*.3,width:image.width*.6,height:image.height*.4}); draw(); URL.revokeObjectURL(url); }; image.src = url; });
  let dragMode = null, dragStart = null, dragRect = null;
  function canvasPoint(e){ const bounds=canvas.getBoundingClientRect(); const scaleX=canvas.width/Math.max(1,bounds.width); const scaleY=canvas.height/Math.max(1,bounds.height); return {x:(e.clientX-bounds.left)*scaleX,y:(e.clientY-bounds.top)*scaleY}; }
  function sourcePoint(e){ const p=canvasPoint(e), scale=Number(canvas.dataset.scale||1), ox=Number(canvas.dataset.offsetX||0), oy=Number(canvas.dataset.offsetY||0); return {x:(p.x-ox)/scale,y:(p.y-oy)/scale}; }
  function hitHandle(p, rect){ const hit=24; const hs=[['nw',rect.x,rect.y],['ne',rect.x+rect.width,rect.y],['sw',rect.x,rect.y+rect.height],['se',rect.x+rect.width,rect.y+rect.height]]; const corner=hs.find(([,x,y])=>Math.abs(p.x-x)<=hit&&Math.abs(p.y-y)<=hit)?.[0]; if(corner)return corner; if(Math.abs(p.x-rect.x)<=hit&&p.y>=rect.y&&p.y<=rect.y+rect.height)return 'w'; if(Math.abs(p.x-(rect.x+rect.width))<=hit&&p.y>=rect.y&&p.y<=rect.y+rect.height)return 'e'; if(Math.abs(p.y-rect.y)<=hit&&p.x>=rect.x&&p.x<=rect.x+rect.width)return 'n'; if(Math.abs(p.y-(rect.y+rect.height))<=hit&&p.x>=rect.x&&p.x<=rect.x+rect.width)return 's'; return null; }
  function updateCursor(e){ if(!image){canvas.style.cursor='default';return;} const h=hitHandle(sourcePoint(e),getRect()); canvas.style.cursor=h&&h.length===2?(h==='nw'||h==='se'?'nwse-resize':'nesw-resize'):h?(h==='n'||h==='s'?'ns-resize':'ew-resize'):'move'; }
  canvas.addEventListener('pointerdown', e=>{ if(!image)return; const p=sourcePoint(e), rect=getRect(), handle=hitHandle(p,rect); if(handle){dragMode=handle;} else if(p.x>=rect.x&&p.x<=rect.x+rect.width&&p.y>=rect.y&&p.y<=rect.y+rect.height){dragMode='move';} else return; dragStart=p; dragRect={...rect}; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e=>{ if(!dragMode)updateCursor(e); });
  canvas.addEventListener('pointermove', e=>{ if(!dragMode||!image)return; const p=sourcePoint(e), dx=p.x-dragStart.x, dy=p.y-dragStart.y, r={...dragRect}; if(dragMode==='move'){r.x=dragRect.x+dx;r.y=dragRect.y+dy;} else { if(dragMode.includes('w')){r.x=dragRect.x+dx;r.width=dragRect.width-dx;} if(dragMode.includes('e'))r.width=dragRect.width+dx; if(dragMode.includes('n')){r.y=dragRect.y+dy;r.height=dragRect.height-dy;} if(dragMode.includes('s'))r.height=dragRect.height+dy; } r.width=Math.max(16,r.width);r.height=Math.max(16,r.height);r.x=Math.max(0,Math.min(image.width-r.width,r.x));r.y=Math.max(0,Math.min(image.height-r.height,r.y));setRect(r);draw(); });
  canvas.addEventListener('pointerup', e=>{dragMode=null;dragStart=null;dragRect=null;try{canvas.releasePointerCapture(e.pointerId);}catch(_){}});
  canvas.addEventListener('pointercancel', ()=>{dragMode=null;dragStart=null;dragRect=null;});
  document.querySelector('#reset').onclick = () => { if(image)setRect({x:image.width*.2,y:image.height*.3,width:image.width*.6,height:image.height*.4}); draw(); };
  document.querySelector('#save').onclick = async () => { const f=fileInput.files[0]; if(!f) return status('请先选择图片', true); const rect=getRect(); if(rect.width<16||rect.height<16) return status('牌面宽度和高度不能小于16像素', true); const busy=toast('正在上传…', 'info', {sticky:true}); try { const uploaded=await uploadFile(f); const uploadData=uploaded?.data||uploaded?.result||uploaded; const uploadToken=uploadData?.token; if(!uploadToken) { console.error('[sign_meme] upload_response_missing_token', {keys:Object.keys(uploadData||{}), request_id:uploadData?.request_id}); throw new Error(uploadData?.message||'上传接口未返回令牌'); } console.info('[sign_meme] upload_succeeded', {request_id:uploadData?.request_id, filename:f.name, bytes:f.size}); const d0=await api('/templates',{method:'POST',body:{upload_token:uploadToken,name:document.querySelector('#name').value,description:document.querySelector('#description').value,caption:document.querySelector('#caption').value,tags:document.querySelector('#tags').value,rect}}); const d=d0?.data||d0?.result||d0; if(!d?.template) throw new Error(d?.message||'保存失败'); console.info('[sign_meme] template_create_succeeded', {request_id:d?.request_id, template_id:d.template?.id}); busy(); toast('保存成功', 'success'); fileInput.value=''; image=null; draw(); await load(); } catch(e) { busy(); toast(e.message||'保存失败', 'error'); } };
  async function loadPreview(template) {
    const image = document.querySelector(`[data-preview-id="${template.id}"]`);
    if (!image) return;
    try {
      const raw = await api(`/image/${template.id}/preview`);
      const data = raw?.data || raw?.result || raw;
      if (!data?.data_url) throw new Error('预览接口未返回图片');
      image.src = data.data_url;
      console.info('[sign_meme] preview_succeeded', {request_id:data.request_id, template_id:template.id});
    } catch (error) {
      image.alt = '预览加载失败';
      console.error('[sign_meme] preview_failed', {template_id:template.id, error:error?.message||String(error)});
    }
  }
  async function load() { const box=document.querySelector('#list'); try { const raw=await api('/templates'); const d=raw?.data||raw?.result||raw; if(!d?.templates) throw new Error(d?.message||'读取失败'); box.className=''; if(!d.templates.length){templatesCache=[];box.textContent='暂无模板';return;} templatesCache=d.templates; box.innerHTML=d.templates.map(t=>`<article class="template"><img data-preview-id="${t.id}" src="" alt="正在加载预览"><div><h3>${escapeHtml(t.name)} ${t.active?'<span class="active">（当前激活）</span>':''}</h3><p>${escapeHtml(t.caption||t.description||'无图片含义')}</p><p>标签：${escapeHtml((t.tags||[]).join('、')||'无')}</p><p>图片：${t.width}×${t.height}，版本：${t.version}</p></div><div class="actions"><button data-id="${t.id}" class="${t.active?'secondary':''}" ${t.active?'disabled':''}>${t.active?'已激活':'设为激活'}</button><button data-edit="${t.id}" class="secondary">编辑语义</button><button data-delete="${t.id}" class="danger" ${t.active?'disabled':''}>删除</button></div></article>`).join(''); d.templates.forEach(loadPreview); box.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{await mutate(`/templates/${b.dataset.id}/activate`,{});}); box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditDialog(b.dataset.edit)); box.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!await confirmDelete('删除此模板？激活模板不可直接删除。'))return;await mutate(`/templates/${b.dataset.delete}`,{method:'DELETE'});}); } catch(e){ box.textContent=e.message; box.className='hint error'; toast('模板列表加载失败：'+(e.message||'未知错误'), 'error'); } }
  async function mutate(path, options){try{await api(path,{method:options.method||'POST',body:options.body||{}});await load();}catch(e){toast(e.message||'操作失败','error');}}
  function confirmBox(message, okText, danger){/* 自绘确认弹窗: iframe sandbox 无 allow-modals, window.confirm 会被静默拦截(点确认类按钮永远返回 false), 故一律用本函数, 禁止再引入原生弹窗 */return new Promise(resolve=>{const wrap=document.createElement('div');wrap.style='position:fixed;inset:0;background:#20232a66;display:grid;place-items:center;z-index:20';wrap.innerHTML=`<div role="dialog" aria-modal="true" style="background:#fff;padding:20px;border-radius:12px;max-width:380px;box-shadow:0 10px 40px #0003"><p style="margin:0;">${escapeHtml(message)}</p><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;"><button data-cancel class="secondary">取消</button><button data-ok class="${danger?'danger':'secondary'}">${escapeHtml(okText)}</button></div></div>`;document.body.append(wrap);const finish=value=>{wrap.remove();resolve(value)};wrap.onclick=e=>{if(e.target===wrap)finish(false)};wrap.querySelector('[data-cancel]').onclick=()=>finish(false);wrap.querySelector('[data-ok]').onclick=()=>finish(true);});}
function confirmDelete(message){return confirmBox(message,'确认删除',true);}
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function openEditDialog(templateId){
    const t = templatesCache.find(x=>x.id===templateId);
    if(!t) return status('模板数据未加载，请刷新页面', true);
    const wrap=document.createElement('div');
    wrap.style='position:fixed;inset:0;background:#20232a66;display:grid;place-items:center;z-index:10';
    wrap.innerHTML=`<div role="dialog" aria-modal="true" style="background:#fff;padding:20px;border-radius:12px;width:min(480px,92vw);box-shadow:0 10px 40px #0003">
      <h3 style="margin:0 0 4px">编辑语义 — ${escapeHtml(t.name)}</h3>
      <p class="hint" style="margin:0 0 8px">保存后自动同步语义池并增量重建向量，检索即可用上新语义。</p>
      <label for="edit-caption">图片含义（caption）</label>
      <textarea id="edit-caption" maxlength="1000" placeholder="描述这个模板适合表达的情绪、语气、动作或聊天场景">${escapeHtml(t.caption||'')}</textarea>
      <label for="edit-tags">图片标签（多个标签用逗号分隔）</label>
      <input id="edit-tags" maxlength="1000" value="${escapeHtml((t.tags||[]).join('，'))}" placeholder="例如：开心，鼓励，调皮，吐槽" />
      <label for="edit-name">模板名称</label>
      <input id="edit-name" maxlength="80" value="${escapeHtml(t.name||'')}" />
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
        <button data-cancel class="secondary" type="button">取消</button>
        <button data-save type="button">保存修改</button>
      </div>
      <p data-err class="hint" style="color:#c83d4d;min-height:18px;margin:8px 0 0"></p>
    </div>`;
    document.body.append(wrap);
    const close=()=>wrap.remove();
    const showErr=(msg)=>{wrap.querySelector('[data-err]').textContent=msg;};
    wrap.querySelector('[data-cancel]').onclick=close;
    wrap.querySelector('[data-save]').onclick=async()=>{
      const caption=wrap.querySelector('#edit-caption').value.trim();
      const tagsRaw=wrap.querySelector('#edit-tags').value.trim();
      const name=wrap.querySelector('#edit-name').value.trim();
      if(!caption) return showErr('图片含义（caption）不能为空：空语义无法进入检索池');
      if(!name) return showErr('模板名称不能为空');
      try{
        await api(`/templates/${templateId}`,{method:'PUT',body:{name,caption,tags:tagsRaw,description:t.description||''}});
        close(); toast('已保存，语义池与向量正在同步', 'success');
        await load();
      }catch(e){ showErr(e.message||'保存失败'); }
    };
  }
  draw(); load();
  (async function modeBar(){
    const cur=document.querySelector('#mode-current'), desc=document.querySelector('#mode-desc');
    const switchBtn=document.querySelector('#mode-switch');
    const render=(d)=>{
      const m=d.sign_mode, compat=d.compat_status||'standalone';
      let label, hint;
      if(m==='integrated' && compat==='downgraded'){
        label='对接检索（已降级为独立模式）';
        hint='未检测到表情包管理器（meme_manager），对接模式不可用，已临时按独立模式运行。'+(d.upstream&&d.upstream.reasons&&d.upstream.reasons.length?('原因: '+d.upstream.reasons.join('；')):'');
        cur.style.color='#b0563c';
      }else if(m==='integrated'){
        label='对接表情包检索';
        const ver=d.compat_upstream_version?`（检测到 meme_manager ${d.compat_upstream_version}）`:'';
        hint=`模板已进入表情包语义检索池：命中后自动生成牌面文字再渲染发送${ver}。`;
        cur.style.color='#2f7d5c';
      }else{
        label='独立使用';
        hint='本插件自管命中（协议注入+激活模板渲染），不依赖表情包管理器。';
        cur.style.color='#2f7d5c';
      }
      cur.textContent=label; desc.textContent=hint;
      if(switchBtn){
        switchBtn.textContent = m==='integrated' ? '切换为独立模式' : '切换为对接检索';
        switchBtn.disabled = false;
      }
    };
    try{ const raw=await api('/mode'); render(raw?.data||raw||{}); }catch(e){ toast('运行模式读取失败：'+(e.message||'未知错误'), 'error'); }
    const btn=document.querySelector('#mode-reconcile');
    if(btn) btn.onclick=async()=>{
      btn.disabled=true;
      const busy=toast('正在同步语义池…', 'info', {sticky:true});
      try{ const raw=await api('/mode/reconcile',{method:'POST',body:{}}); const d=raw?.data||raw||{};
        busy(); toast('语义池已同步：'+JSON.stringify(d.reconcile||d), 'success');
        try{ const m=await api('/mode'); render(m?.data||m||{}); }catch(_){}
      }catch(e){ busy(); toast(e.message||'同步失败', 'error'); }
      btn.disabled=false;
    };
    if(switchBtn) switchBtn.onclick=async()=>{
      const raw0=await api('/mode').catch(()=>null);
      const cur0=(raw0?.data||raw0||{}).sign_mode||'standalone';
      const target=cur0==='integrated'?'standalone':'integrated';
      if(target==='integrated' && !await confirmBox('切换为对接检索模式？将把举牌模板加入表情包语义检索池。','切换为对接检索'))return;
      if(target==='standalone' && !await confirmBox('切换为独立模式？将把举牌模板从语义检索池移除。','切换为独立模式'))return;
      switchBtn.disabled=true;
      const busy=toast('正在切换…', 'info', {sticky:true});
      try{
        const raw=await api('/mode/reconcile',{method:'POST',body:{sign_mode:target}});
        const d=raw?.data||raw||{};
        busy();
        if(d.ok===false){ toast(d.message||'切换失败', 'error'); }
        else{ toast('已切换为 '+(d.sign_mode===target?target:'…')+'，语义池已同步', 'success'); }
        try{ const m=await api('/mode'); render(m?.data||m||{}); }catch(_){}
      }catch(e){ busy(); toast(e.message||'切换失败', 'error'); }
      switchBtn.disabled=false;
    };
  })();
})();
</script>
</body>
</html>
